# This example contains no real keys. Copy into Streamlit's Secrets settings.
# Paste your actual key between the quotes there, never into GitHub.
AI_PROVIDER = "gemini"
GEMINI_API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE"
GEMINI_MODEL = "gemini-3.5-flash-lite"
AI_REQUESTS_PER_MINUTE = 3
AI_TOKENS_PER_MINUTE = 20000

# Optional alternative; select it in the app after setting a real key.
# OPENROUTER_API_KEY = "PASTE_YOUR_OPENROUTER_KEY_HERE"
# OPENROUTER_MODEL = "openrouter/free"
# GROQ_API_KEY = "PASTE_YOUR_GROQ_KEY_HERE"
# GROQ_MODEL = "openai/gpt-oss-120b"

# Local deployment only; see LOCAL_OLLAMA.md before enabling.
